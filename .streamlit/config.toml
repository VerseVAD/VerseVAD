[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[runner]
# VerseVAD uses explicit Streamlit output calls. Disabling unused magic syntax
# avoids reparsing the large application source on every widget rerun.
magicEnabled = false

[server]
address = "127.0.0.1"
headless = false
maxUploadSize = 5
runOnSave = false

[theme]
primaryColor = "#A34F32"
backgroundColor = "#FBF8F1"
secondaryBackgroundColor = "#F3EFE5"
textColor = "#172A3A"
font = "sans-serif"
